[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aagam"
version = "0.1.0"
description = "AAGAM: a Company Secretary's workbench. Documents, precedents, company file, filings, due dates, drafting and law, on her own laptop, with local AI and Claude Desktop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.63",  # connect_over_cdp(no_defaults=True) keeps her downloads and display settings
    "pypdfium2>=4.30",
    "pillow>=10",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "xlrd>=2.0",
    "striprtf>=0.0.26",
    "extract-msg>=0.48",
    # Windows' own OCR engine, so scans become searchable with nothing else to install.
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "xlwt>=1.3"]

[project.scripts]
aagam = "aagam.cli:main"
csdesk = "csdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csdesk = ["vault/schema.sql", "forms/demo/*.html", "recorder/*.js"]
aagam = ["schema.sql", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a local Chrome or Edge (skipped when neither is installed)",
    "local_ai: talks to a real Ollama on this computer (skipped when it isn't running)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Long lines are allowed: legal text and SQL read better unbroken. B008 is FastAPI's File()/Form() defaults.
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "UP007", "SIM108", "SIM905", "B008"]
