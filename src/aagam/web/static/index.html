    <script>
      // Apply the saved theme before the page paints, so there is no flash of the wrong one.
      // A link can choose the theme too (…/?theme=banaras); it is then remembered like a choice from the menu.
      try {
        var asked = new URLSearchParams(location.search).get("theme");
        if (asked && /^(system|light|night|dark|banaras)$/.test(asked)) localStorage.setItem("aagam.theme", asked);
        var t = localStorage.getItem("aagam.theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
